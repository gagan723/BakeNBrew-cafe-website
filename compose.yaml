name: bakenbrew

services:
  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [cafe]

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/bakenbrew}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET in .env.docker}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
    ports:
      - "127.0.0.1:${MCP_PORT:-8001}:8001"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 20s
    networks: [cafe]

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/bakenbrew}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET in .env.docker}
      CHAT_CONFIRMATION_SECRET: ${CHAT_CONFIRMATION_SECRET:?Set CHAT_CONFIRMATION_SECRET in .env.docker}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env.docker}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      MCP_HTTP_URL: http://mcp-server:8001/mcp
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 20s
    networks: [cafe]

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [cafe]

volumes:
  mongo_data:

networks:
  cafe:
    driver: bridge
